spring:
  application:
    name: ragchatbot

springdoc:
  swagger-ui:
    path: /swagger-ui.html

chat:
  models:
    default: ${LLM_MODEL:Qwen3.6-35B-A3B}
    allowed: ${LLM_ALLOWED_MODELS:DeepSeek-V4-Flash,DeepSeek-V4-Pro,glm-4.5-air,Qwen3.6-35B-A3B,step-3.7-flash}
  rag:
    top-k: 5
    # Минимальный порог cosine similarity (0.0–1.0).
    # 0.0 — без фильтрации, брать все top-k результатов.
    # Рекомендуется поднять до 0.5–0.6 после первичного тестирования.
    min-similarity: 0.35
  max-history-messages: 20  # Максимум сообщений истории в LLM (FIFO-обрезка)
  title-generation:
    poll-ms: 1000

search:
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
    alias: ${ELASTICSEARCH_ALIAS:chat-search}
    enabled: ${ELASTICSEARCH_ENABLED:true}
    poll-ms: 1000

app:
  security:
    jwt:
      issuer: ragchatbot-java-service
      ttl-minutes: 120
      # Для учебного окружения можно хранить в env APP_SECURITY_JWT_SECRET.
      secret: ${APP_SECURITY_JWT_SECRET:change-me-please-change-me-please-32chars}

logging:
  level:
    root: INFO
