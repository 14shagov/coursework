services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    image: ghcr.io/14shagov/coursework-python-service:latest
    container_name: rag-python-service
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4.1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://models.github.ai/inference}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  java-service:
    image: ghcr.io/14shagov/coursework-java-service:latest
    container_name: rag-java-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ragdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-raguser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      PYTHON_SERVICE_BASE_URL: http://python-service:8000
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_started

volumes:
  pg_data:
