services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    image: ghcr.io/14shagov/coursework-python-service:latest
    container_name: rag-python-service
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?}
      EMBEDDING_GITHUB_TOKEN: ${EMBEDDING_GITHUB_TOKEN:-}
      LLM_MODEL: ${LLM_MODEL:?}
      TITLE_LLM_MODEL: ${TITLE_LLM_MODEL:-step-3.7-flash}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:?}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-high}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?}
      CHAT_API_BASE_URL: ${CHAT_API_BASE_URL:?}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:?}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  java-service:
    image: ghcr.io/14shagov/coursework-java-service:latest
    container_name: rag-java-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-change-me-please-change-me-please-32chars}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ragdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-raguser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      PYTHON_SERVICE_BASE_URL: http://python-service:8000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LLM_MODEL: ${LLM_MODEL:?}
      LLM_ALLOWED_MODELS: ${LLM_ALLOWED_MODELS:?}
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      python-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    container_name: rag-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ghcr.io/14shagov/coursework-web:latest
    container_name: rag-web
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      java-service:
        condition: service_started

  caddy:
    image: caddy:2
    container_name: rag-caddy
    restart: unless-stopped
    profiles: ["public"]
    environment:
      SERVER_IP: ${SERVER_IP:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  pg_data:
  elasticsearch_data:
  caddy_data:
  caddy_config:
